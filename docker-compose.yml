services:
  mysql:
    image: mysql:8.4
    container_name: ratelimiter-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ratelimit_db}
      MYSQL_USER: ${DB_USER:-ratelimiter}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ratelimiter_dev}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: