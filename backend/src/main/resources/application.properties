spring.application.name=rate-limiter-backend
server.port=${SERVER_PORT:8080}

# Database configuration (overridable via environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ratelimit_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:ratelimiter}
spring.datasource.password=${DB_PASSWORD:ratelimiter_dev}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration